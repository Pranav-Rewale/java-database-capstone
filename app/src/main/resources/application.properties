# -------------------------------------------------------------------
# Thymeleaf Engine Configuration Blueprint
# -------------------------------------------------------------------
# Defines the target classpath base directory to lookup server-rendered dashboard views
spring.thymeleaf.prefix=classpath:/templates/

# Instructs the layout controller to resolve strings automatically using .html endings
spring.thymeleaf.suffix=.html

# Dictates parsing behavior standardizations optimized for modern HTML5 rules
spring.thymeleaf.mode=HTML

# Disables background file caching during active development so changes reflect instantly
spring.thymeleaf.cache=false

# Enforces global character serialization standards to shield against text rendering leaks
spring.thymeleaf.encoding=UTF-8
