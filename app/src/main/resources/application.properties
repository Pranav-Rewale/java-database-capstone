# ===================================================================
# 1. Core Application Configuration
# ===================================================================
spring.application.name=back-end

# ===================================================================
# 2. MySQL Database Configuration
# ===================================================================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:cms}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}

# Optional Driver (safe to include)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# 3. JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# 4. MongoDB Configuration
# ===================================================================
spring.data.mongodb.uri=${MONGO_URI:mongodb://root:root@localhost:27017/prescriptions?authSource=admin}

# ===================================================================
# 5. Actuator (Health Monitoring)
# ===================================================================
management.endpoint.health.show-details=always
management.health.db.enabled=true

# ===================================================================
# 6. Security / JWT
# ===================================================================
api.path=/
jwt.secret=${JWT_SECRET:change_this_secret_in_env}

# ===================================================================
# 7. Static Resources
# ===================================================================
spring.web.resources.static-locations=classpath:/static/

# ===================================================================
# 8. Thymeleaf Configuration
# ===================================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8